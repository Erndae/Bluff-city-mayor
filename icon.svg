<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3550"/><stop offset=".62" stop-color="#132538"/><stop offset="1" stop-color="#0d1822"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <linearGradient id="pyr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9eef3"/><stop offset=".5" stop-color="#c3ced8"/><stop offset=".5" stop-color="#8fa1b2"/><stop offset="1" stop-color="#6d8194"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6f9e"/><stop offset="1" stop-color="#1d4a6c"/></linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="232" r="150" fill="url(#sun)"/>
    <circle cx="256" cy="232" r="150" fill="none" stroke="#fff3d6" stroke-opacity=".35" stroke-width="6"/>
    <!-- the Pyramid -->
    <path d="M256 104 L382 330 L130 330 Z" fill="url(#pyr)"/>
    <path d="M256 104 L382 330 L256 330 Z" fill="#0d1822" opacity=".12"/>
    <!-- bridge: two lit arches across the river -->
    <path d="M40 330 Q148 236 256 330 Q364 236 472 330" fill="none" stroke="#0d1822" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 330 Q148 236 256 330 Q364 236 472 330" fill="none" stroke="#ffd27a" stroke-width="9" stroke-linecap="round"/>
    <g fill="#fff3d6"><circle cx="94" cy="290" r="5"/><circle cx="148" cy="272" r="5"/><circle cx="202" cy="290" r="5"/><circle cx="310" cy="290" r="5"/><circle cx="364" cy="272" r="5"/><circle cx="418" cy="290" r="5"/></g>
    <rect x="0" y="326" width="512" height="14" fill="#0d1822"/>
    <!-- the river -->
    <rect x="0" y="340" width="512" height="172" fill="url(#river)"/>
    <path d="M0 384 Q64 368 128 384 T256 384 T384 384 T512 384" fill="none" stroke="#7fb6dc" stroke-opacity=".55" stroke-width="8"/>
    <path d="M0 432 Q64 416 128 432 T256 432 T384 432 T512 432" fill="none" stroke="#7fb6dc" stroke-opacity=".35" stroke-width="8"/>
    <!-- reflection -->
    <path d="M196 350 L316 350 L286 404 L226 404 Z" fill="#ffd27a" opacity=".22"/>
    <!-- mayor's star -->
    <path d="M256 36 l14 29 32 4 -23 22 6 32 -29-15 -29 15 6-32 -23-22 32-4z" fill="#fff3d6"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#f2a93b" stroke-width="10"/>
</svg>
